
<!DOCTYPE html>
<html>
<head>
    <title>Book Tour</title>
</head>
<body>

    <h1>Book Tour</h1>

    <h2>{{ tour.title }}</h2>

    <p>
        {{ tour.description }}
    </p>

    <p>
        Price: ₹{{ tour.price }}
    </p>

    <p>
        Available Seats: {{ tour.available_seats }}
    </p>

    {% if tour.available_seats > 0 %}

        <form method="POST">

            {% csrf_token %}

            <label for="seats">
                Number of Seats:
            </label>

            <input
                type="number"
                id="seats"
                name="seats"
                min="1"
                max="{{ tour.available_seats }}"
                required
            >

            <br><br>

            <button type="submit">
                Confirm Booking
            </button>

        </form>

    {% else %}

        <p>No seats available.</p>

    {% endif %}

    <br>

    <a href="{% url 'home' %}">
        Back to Tours
    </a>

</body>
</html>
